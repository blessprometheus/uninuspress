services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-press}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-press}
      POSTGRES_DB: ${POSTGRES_DB:-uninus_press}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-press} -d ${POSTGRES_DB:-uninus_press}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-press}:${POSTGRES_PASSWORD:-press}@db:5432/${POSTGRES_DB:-uninus_press}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
