; php:8.3-cli-alpine ships with no php.ini by default, so PHP falls back to
; compiled-in defaults (upload_max_filesize=2M, post_max_size=8M,
; memory_limit=128M) — far too small for naskah (hingga 20MB) dan cover buku
; (docs/requirements.md #6). Lihat juga: ini sebabnya PDF bukti pengajuan
; sempat gagal untuk foto kwitansi besar sebelum ini diatur.
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 120
